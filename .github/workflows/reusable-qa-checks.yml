name: CI

on:
  workflow_call:

# Permissions should be configured at the job level.
permissions: {}

jobs:
  xmllint:
    permissions:
      contents: read # To clone the repo.

    name: 'Check install and XML'
    runs-on: ubuntu-latest

    env:
      XMLLINT_INDENT: '    '

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 'latest'
          coverage: none
        env:
          fail-fast: true

      # Install dependencies to make sure the PHPCS XSD file is available.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Validate the composer.json file.
      # @link https://getcomposer.org/doc/03-cli.md#validate
      - name: Validate Composer installation
        run: composer validate --no-check-all --strict

      # Validate the xml file.
      - name: Validate against schema
        uses: phpcsstandards/xmllint-validate@d0ee207a94a9539f5d14e78e3b13a81385252c88 # v2.0.1
        with:
          pattern: "PHPCSDev/ruleset.xml"
          xsd-file: "vendor/squizlabs/php_codesniffer/phpcs.xsd"

      # Check the code-style consistency of the xml file.
      # Note: this needs xmllint, but that will be installed via the phpcsstandards/xmllint-validate action runner.
      - name: Check code style
        run: diff -B ./PHPCSDev/ruleset.xml <(xmllint --format "./PHPCSDev/ruleset.xml")

  yamllint:
    permissions:
      contents: read # To clone the repo.

    name: 'Lint Yaml'
    uses: PHPCSStandards/.github/.github/workflows/reusable-yamllint.yml@5a8a6fcf1ac33b3ec6d7b826c0f319eaa83581ff # v1.3.1
    with:
      strict: true

  pinact:
    permissions:
      contents: read # To clone the repo.

    name: 'Run Pinact'
    uses: PHPCSStandards/.github/.github/workflows/reusable-pinact.yml@5a8a6fcf1ac33b3ec6d7b826c0f319eaa83581ff # v1.3.1

  markdownlint:
    permissions:
      contents: read # To clone the repo.

    name: 'Lint Markdown'
    uses: PHPCSStandards/.github/.github/workflows/reusable-markdownlint.yml@5a8a6fcf1ac33b3ec6d7b826c0f319eaa83581ff # v1.3.1

  remark:
    permissions:
      contents: read # To clone the repo.

    name: 'QA Markdown'
    uses: PHPCSStandards/.github/.github/workflows/reusable-remark.yml@5a8a6fcf1ac33b3ec6d7b826c0f319eaa83581ff # v1.3.1
